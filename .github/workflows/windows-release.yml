name: Windows portable release

on:
  workflow_dispatch:
    inputs:
      edition:
        description: Model access edition to build
        type: choice
        options: [all, '1.00.01', '1.00.02']
        default: all
  release:
    types: [published]
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install test dependencies
        run: python -m pip install -r requirements.lock.txt -r requirements.desktop.lock.txt
      - name: Select edition and verify version tag
        id: edition
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
          MANUAL_EDITION: ${{ inputs.edition || 'all' }}
          EVENT_NAME: ${{ github.event_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          $sourceVersion = python -c "from src.version import VERSION; print(VERSION)"
          $edition = $env:MANUAL_EDITION
          if ($env:EVENT_NAME -eq 'release' -or $env:IS_TAG -eq 'true') {
            if ($env:RELEASE_TAG -notmatch '^v(1\.00\.0[12])(?:-r[1-9][0-9]*)?$') { throw 'Invalid edition or revision tag' }
            $edition = $Matches[1]
          }
          if ($sourceVersion -eq '1.00.01' -and $edition -ne '1.00.01') { throw 'API-only source cannot build the Magpie edition' }
          if ($sourceVersion -notin @('1.00.01','1.00.02')) { throw 'Unknown source edition' }
          "edition=$edition" >> $env:GITHUB_OUTPUT
      - name: Test
        run: python -m unittest discover -s tests -q
      - name: Test native QQ protocol
        run: node --test tests/qq-native.test.js
      - name: Build Windows and clean source packages
        shell: pwsh
        env:
          BUILD_EDITION: ${{ steps.edition.outputs.edition }}
        run: |
          python tools/build-editions.py --edition $env:BUILD_EDITION --sevenzip 'C:\Program Files\7-Zip\7z.exe'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: QQ-ChatBot-Windows-and-source
          path: dist/*
          if-no-files-found: error
  attach-release:
    if: github.event_name == 'release' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: QQ-ChatBot-Windows-and-source
          path: dist
      - name: Publish release and attach assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          # Reruns update assets for this exact tag; never delete releases or move tags.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            args=(--generate-notes)
            edition="${tag#v}"
            edition="${edition%%-r*}"
            for candidate in "docs/RELEASE_NOTES_${tag#v}.md" "docs/RELEASE_NOTES_${edition}.md"; do
              if [ -f "$candidate" ]; then args=(--notes-file "$candidate"); break; fi
            done
            gh release create "$tag" --verify-tag --title "QQ ChatBot $tag" "${args[@]}" dist/*
          fi
