name: Windows portable release

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install test dependencies
        run: python -m pip install -r requirements.lock.txt -r requirements.desktop.lock.txt
      - name: Verify version tag
        if: github.event_name == 'release' || github.event_name == 'push'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          $releaseVersion = python -c "from src.version import VERSION; print(VERSION)"
          if ($env:RELEASE_TAG -ne "v$releaseVersion") { throw 'Release tag must match src/version.py' }
      - name: Test
        run: python -m unittest discover -s tests -q
      - name: Build Windows and clean source packages
        shell: pwsh
        run: |
          python tools/build-windows.py --sevenzip 'C:\Program Files\7-Zip\7z.exe'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/package-release.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: QQ-ChatBot-Windows-and-source
          path: dist/*
          if-no-files-found: error
  attach-release:
    if: github.event_name == 'release' || github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: QQ-ChatBot-Windows-and-source
          path: dist
      - name: Publish release and attach assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
          IS_PUBLISHED: ${{ github.event_name == 'release' }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          # 标签已存在时发布失败，先删掉同名草稿再重建；已正式发布则只补资产。
          if [ "$IS_PUBLISHED" = "true" ]; then
            gh release upload "$tag" dist/* --clobber
          else
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release delete "$tag" --yes --cleanup-tag
            fi
            gh release create "$tag" --title "QQ ChatBot $tag" --generate-notes dist/*
          fi
